name: Armageddon Seeder Tests

on:
  pull_request:
    paths:
      - 'ArmageddonSeeder/**'
      - 'ArmageddonSeeder Unit Tests/**'
      - 'SeederFramework/**'
      - 'SeederFoundations/**'
      - 'DatabaseSeeder/**'
      - 'DatabaseSeeder Unit Tests/**'
      - 'FutureMUDLibrary/**'
      - 'MudsharpDatabaseLibrary/**'
      - 'MudSharpCore/**'
      - 'MigrationModels/**'
      - 'BuildTools/MigrationModelCompiler/**'
      - 'ExpressionEngine/**'
      - 'FutureMUD Analyzers/FutureMUD_Analyzers/**'
      - 'Design Documents/Data/**'
      - 'Design Documents/Items/**'
      - 'Design Documents/Magic/Armageddon_Sorcerer_Source_Tree.json'
      - 'Design Documents/Magic/Armageddon_Seeder_Completeness_Design_20261011.json'
      - 'scripts/*Armageddon*'
      - 'scripts/*armageddon*'
      - 'scripts/tests/test_armageddon_worldfile_package.py'
      - 'Design Documents/Seeding/Armageddon_*'
      - 'scripts/TestReporting/**'
      - 'scripts/unit-test-projects.txt'
      - 'global.json'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'ArmageddonSeeder.sln'
      - 'MudSharp.sln'
      - '.github/workflows/**'
      - 'FutureMUD.Web/Configuration/release-products.json'
      - 'scripts/update-development-solutions.py'
      - 'scripts/invoke-test-reporting.*'
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armageddon-seeder-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  armageddon-seeder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Check opt-in solution layout
        run: python scripts/update-development-solutions.py --check
      - name: Check synthetic worldfile packet preparation
        run: python -B -m unittest discover -s scripts/tests -p test_armageddon_worldfile_package.py
      - name: Restore Armageddon Seeder unit-test graph
        run: dotnet restore "ArmageddonSeeder Unit Tests/ArmageddonSeeder Unit Tests.csproj" -m:1 -p:RestoreBuildInParallel=false -p:NuGetAudit=true
      - name: Build Armageddon Seeder Debug
        run: dotnet build ArmageddonSeeder/ArmageddonSeeder.csproj -c Debug --no-restore -m:1
      - name: Build Armageddon Seeder Release
        run: dotnet build ArmageddonSeeder/ArmageddonSeeder.csproj -c Release --no-restore -m:1
      - name: Run Armageddon Seeder unit tests
        if: runner.os == 'Linux'
        run: bash ./scripts/invoke-test-reporting.sh fast --output-mode compact --project 'ArmageddonSeeder Unit Tests/ArmageddonSeeder Unit Tests.csproj'
      - name: Run Armageddon Seeder unit tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\invoke-test-reporting.ps1 -Suite fast -OutputMode Compact -Project "ArmageddonSeeder Unit Tests/ArmageddonSeeder Unit Tests.csproj"
      - name: Retain structured test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: armageddon-seeder-test-evidence-${{ matrix.os }}
          path: |
            .artifacts/test-runs/**/run.json
            .artifacts/test-runs/**/summary.json
            .artifacts/test-runs/**/summary.txt
            .artifacts/test-runs/**/test-results.json
            .artifacts/test-runs/**/failures.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
