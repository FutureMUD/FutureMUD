name: Climate Regression Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climate-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  climate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Restore climate test dependencies
        run: dotnet restore "MudSharpCore Climate Tests/MudSharpCore Climate Tests.csproj" -m:1 -p:RestoreBuildInParallel=false -p:NuGetAudit=false
      - name: Run climate regression gate
        shell: bash
        run: bash ./scripts/test-unit-climate.sh
