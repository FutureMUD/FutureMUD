name: Extended Integration and Benchmark Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Run extended tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/test-unit.sh --include-extended
      - name: Run extended tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\scripts\test-unit.ps1 -IncludeExtended'
      - name: Run extended Item Seeder tests on Linux
        if: runner.os == 'Linux'
        run: dotnet test "ItemSeeder Unit Tests/ItemSeeder Unit Tests.csproj" -c Debug -m:1 -p:RestoreBuildInParallel=false -p:IncludeExtendedTests=true
      - name: Run extended Item Seeder tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet test "ItemSeeder Unit Tests/ItemSeeder Unit Tests.csproj" -c Debug -m:1 -p:RestoreBuildInParallel=false -p:IncludeExtendedTests=true
      - name: Run extended Armageddon Seeder tests
        run: dotnet test "ArmageddonSeeder Unit Tests/ArmageddonSeeder Unit Tests.csproj" -c Debug -m:1 -p:RestoreBuildInParallel=false -p:IncludeExtendedTests=true
      - name: Summarize test timings
        if: always()
        shell: pwsh
        run: ./scripts/Write-CiTestSummary.ps1
      - name: Retain structured test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extended-test-evidence-${{ matrix.os }}
          path: |
            .artifacts/test-runs/**/run.json
            .artifacts/test-runs/**/summary.json
            .artifacts/test-runs/**/summary.txt
            .artifacts/test-runs/**/test-results.json
            .artifacts/test-runs/**/failures.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
