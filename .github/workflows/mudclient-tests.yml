name: MudClient Tests

on:
  pull_request:
    paths:
      - 'MudClient/**'
      - 'global.json'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'test-default.runsettings'
      - '.github/workflows/mudclient-tests.yml'
  push:
    branches: [master]
    paths:
      - 'MudClient/**'
      - 'global.json'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'test-default.runsettings'
      - '.github/workflows/mudclient-tests.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mudclient-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Resolve the SDK against this product's global.json.
    working-directory: MudClient
    shell: pwsh

jobs:
  mudclient:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: MudClient/global.json
      # wasm-tools is needed for optimized publishing, not this test build.
      - name: Restore MudClient test graph
        run: dotnet restore MudClientTests/MudClientTests.csproj -m:1 -p:RestoreBuildInParallel=false -p:NuGetAudit=true
      - name: Run MudClient Release tests
        run: dotnet test MudClientTests/MudClientTests.csproj -c Release --no-restore -m:1 --logger 'trx;LogFileName=mudclient.trx' --results-directory ../.artifacts/mudclient-tests
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mudclient-test-results-${{ matrix.os }}
          path: .artifacts/mudclient-tests/**/*.trx
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
