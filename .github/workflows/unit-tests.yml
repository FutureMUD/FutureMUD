name: Unit Tests

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Retain build headroom; integration and benchmark cases are explicitly excluded.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check development solution filters and helper build order
        run: python scripts/update-development-solutions.py --check
      - name: Run default unit-test gate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/test-unit.sh
      - name: Run default unit-test gate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\scripts\test-unit.ps1'
      - name: Verify migration build and design-time integration
        run: python scripts/test-build-architecture.py
      - name: Summarize test timings
        if: always()
        shell: pwsh
        run: ./scripts/Write-CiTestSummary.ps1
      - name: Retain structured test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-evidence-${{ matrix.os }}
          path: |
            .artifacts/test-runs/**/run.json
            .artifacts/test-runs/**/summary.json
            .artifacts/test-runs/**/summary.txt
            .artifacts/test-runs/**/test-results.json
            .artifacts/test-runs/**/failures.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
