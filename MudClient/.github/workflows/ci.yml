name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

env:
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MudClientSolution.sln

      - name: Build
        run: dotnet build MudClientSolution.sln -c ${{ env.CONFIGURATION }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test MudClientSolution.sln -c ${{ env.CONFIGURATION }} --no-build --logger "trx;LogFileName=test-results.trx"
